name: Box B Live
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Timeframe select karo'
        required: true
        default: '15m'
        type: choice
        options:
          - 5m
          - 15m
          - 30m
          - 1h
      channel_width:
        description: 'Box Width % (Sensitivity)'
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '8'
      period:
        description: 'Data Period'
        required: true
        default: '20d'
        type: choice
        options:
          - 5d
          - 20d
          - 60d

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TIMEFRAME: ${{ inputs.timeframe || '15m' }}
          CHANNEL_WIDTH: ${{ inputs.channel_width || '5' }}
          PERIOD: ${{ inputs.period || '20d' }}
        run: python bot.py
